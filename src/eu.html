<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiCRS Atlas — EU NUTS-2 Detail</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* EU-specific overlay swatches (reuses the shared design system). */
    .sw-wwtp   { background: #5bb0c7; }
    .sw-proj   { background: #46b3ff; border-radius: 50%; }
    .sw-form   { background: rgba(122,166,255,.5); border:1px solid #6f93c9; }
    .d-metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .d-metrics > div { background:var(--panel-2,#161e26); border:1px solid var(--line);
      border-radius:8px; padding:7px 9px; }
    .d-metrics .k { color:var(--ink-3); font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
    .d-metrics .v { font-size:13px; margin-top:2px; }
    .lowsup { color:#e6c06a; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <div class="brand-mark">EU</div>
      <div class="brand-text">
        <h1>BiCRS Atlas — EU</h1>
        <p>NUTS-2 feedstock · storage · best-use</p>
      </div>
    </header>

    <div class="panel-scroll">
      <section class="control-group">
        <h2>Map mode</h2>
        <div class="seg" id="mode-seg">
          <button class="seg-btn active" data-mode="feedstock">Feedstock supply</button>
          <button class="seg-btn" data-mode="recommendation">Best-use recommendation</button>
        </div>
      </section>

      <section class="control-group" id="feedstock-controls">
        <h2>Feedstock layer</h2>
        <select id="feedstock-select">
          <option value="ag">Agricultural residues</option>
          <option value="forestry">Forestry residues</option>
          <option value="msw_biogenic">Municipal solid waste (biogenic)</option>
          <option value="manure">Animal manure</option>
          <option value="wwtp">Human / WWTP biosolids</option>
        </select>
        <p class="hint" id="feedstock-hint"></p>
      </section>

      <section class="control-group">
        <h2>Overlays</h2>
        <label class="chk"><input type="checkbox" id="ov-facilities" /> <span class="sw sw-fac"></span> Biogenic point sources</label>
        <label class="chk"><input type="checkbox" id="ov-wwtps" /> <span class="sw sw-wwtp"></span> Large WWTPs (≥150k PE)</label>
        <label class="chk"><input type="checkbox" id="ov-projects" /> <span class="sw sw-proj"></span> CO₂ storage projects / hubs</label>
        <label class="chk"><input type="checkbox" id="ov-formations" /> <span class="sw sw-form"></span> CO₂ storage formations (CO2StoP)</label>
      </section>

      <section class="control-group">
        <h2 id="legend-title">Legend</h2>
        <div id="legend"></div>
      </section>

      <section class="control-group">
        <button class="link-btn" id="open-method">Methodology &amp; sources ›</button>
      </section>
    </div>

    <footer class="side-foot">
      <div class="stat"><span id="stat-cdr">—</span><label>Mt CO₂/yr EU NUTS-2 CDR potential</label></div>
      <div class="disclaimer">Internal strategy tool · regional estimates carry uncertainty — see methodology.</div>
    </footer>
  </aside>

  <div id="map"></div>

  <aside id="detail" class="hidden">
    <button class="detail-close" id="detail-close">×</button>
    <div id="detail-body"></div>
  </aside>

  <div id="method-modal" class="modal hidden">
    <div class="modal-card">
      <button class="detail-close" id="method-close">×</button>
      <div id="method-body"></div>
    </div>
  </div>

  <div id="hovertip" class="hovertip hidden"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="../data/geo/geometry_eu_nuts.js"></script>
  <script src="../data/geo/geometry_eu_storage.js"></script>
  <script src="data_bundle_eu.js"></script>
  <script src="app-eu.js"></script>
</body>
</html>
